services:
  postgres:
    image: postgres:16-alpine
    container_name: springbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: springbank
      POSTGRES_USER: springbank
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - springbank-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springbank -d springbank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  springbank-data:
